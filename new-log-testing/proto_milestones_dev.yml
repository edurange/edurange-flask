# Milestone file will be preprocessed to replace OCTET
# labels(types): input, output, compound
# currently no way to have a sub goal of a compound not be directly related to
# the current line, but a general sense of the user having achieved something

- !Node
  objective: ssh with -p and correct port
  label: input
  value: ssh 10.OCTET.0.7 -p 123
  strictness: full

- !Node
  objective: use nmap to display next ip/reach next host
  label: compound
  value: OR
  left: !Node
    label: input
    value: nmap
  right: !Node
    label: output
    value: 10.OCTET.0.13

- !Node
  objective: something
  label: compound
  value: OR
  left:
    !Node
    label: input
    value: something
  right: !Node
    label: compound
    value: AND
    left: !Node
      label: input
      value: something else
    right: !Node
      label: output
      value: fffff

- !Node
  label: input
  objective: ssh with -i and identity file
  value: ssh 10.OCTET.0.10 -i id_rsa
  strictness: FullMatch

- !Node
  label: output
  objective: find the password to fourth stop
  value: 7035efa5

- !Node
  label: input
  objective: ssh from non-blocked ip to fourth stop
  value: ssh 10.OCTET.0.14 -p <port>
  hostname: NOT thirdstop
  strictness: FullMatch

- !Node
  label: output
  objective: retrieve the hint from the FTP server
  value: 'decryption_password: 8fddakjfds0s9f'

- !Node
  label: output
  objective: Succesfully decrypt fifth stop password
  value: '95541890'

- !Node
  label: compound
  objective: read betcha_cant_read_me using base64
  left: !Node
    label: input
    value: base64 --decode -d betcha_cant_read_me
    hostname: FifthStop
    strictness: FullMatch
  right: !Node
    label: output
    value: You found me. Good job.
  value: AND

- !Node
  label: output
  objective: read final flag
  value: 'ZLKDOXQP VLR XOB QEB PPE FKZBMQFLK JXPQBO. Ebob fp vlro mollc: 5y2687a5'
  hostname: FifthStop
  strictness: FullMatch
